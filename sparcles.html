<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonar Samaj - Golden Community Portal</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      position: relative;
    }

    /* Glitter Effect Background */
    .glitter-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('assets/images/gold-glitter.png') no-repeat center center;
      background-size: cover;
      pointer-events: none; /* Allow interactions through it */
      z-index: 999;
      opacity: 0.5;
      animation: shimmer 10s infinite alternate;
    }

    /* Glitter Animation */
    @keyframes shimmer {
      0% { transform: scale(1) translateY(0); opacity: 0.5; }
      50% { transform: scale(1.05) translateY(-10px); opacity: 0.6; }
      100% { transform: scale(1) translateY(0); opacity: 0.5; }
    }

    /* Example content */
    .content {
      position: relative;
      z-index: 1;
      padding-top: 100px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      color: #b8860b; /* golden color */
      font-weight: 700;
    }

    p {
      font-size: 1.2rem;
      color: #555;
      margin-top: 20px;
    }

    /* Optional: button style */
    .btn-gold {
      background-color: #b8860b;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      margin-top: 20px;
      transition: background-color 0.3s ease;
    }
    .btn-gold:hover {
      background-color: #daa520;
      color: white;
    }
  </style>
</head>

<body>

  <!-- Glitter Effect Layer -->
  <div class="glitter-effect"></div>

  <!-- Main Content -->
  <div class="content">
    <h1>Welcome to Sonar Samaj</h1>
    <p>Unity, Tradition, Prosperity</p>
    <a href="register.php" class="btn-gold">Join Now</a>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Optional: Make glitter layer follow slight mouse movement
    const glitter = document.querySelector('.glitter-effect');

    document.addEventListener('mousemove', (e) => {
      const moveX = (e.clientX / window.innerWidth) * 20;
      const moveY = (e.clientY / window.innerHeight) * 20;
      glitter.style.transform = `translate(${moveX}px, ${moveY}px)`;
    });
  </script>

</body>
</html>
